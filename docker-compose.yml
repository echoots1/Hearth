# Hearth: the app plus Postgres.
#
# Pulls the published image. To build from source instead, add the override:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build
#
# Settings come from .env next to this file (copy .env.example) or from your
# shell. Only the database password is needed; everything else is set in the
# app (More → Server, Integrations, Notifications) or generated on first
# start. deploy/truenas/ has a copy with literal values.
services:
  app:
    image: ghcr.io/echoots1/hearth:${HEARTH_TAG:-main}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_SECRET: ${APP_SECRET:-}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      # Postgres: the bundled db service. Any characters are fine in the
      # password; nothing is URL-encoded. DATABASE_URL is only for an external
      # database and overrides these when set.
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER:-hearth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hearth}
      POSTGRES_DB: ${POSTGRES_DB:-hearth}
      DATABASE_URL: ${DATABASE_URL:-}
      # The container always listens on 3000; PORT in .env is the host port below.
      PORT: "3000"
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      # Generated APP_SECRET / APP_ENCRYPTION_KEY when you don't supply them.
      # Back it up with the database.
      - hearth-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hearth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hearth}
      POSTGRES_DB: ${POSTGRES_DB:-hearth}
    volumes:
      - hearth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hearth} -d ${POSTGRES_DB:-hearth}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # Uncomment to reach Postgres from the host for development:
    # ports:
    #   - "5432:5432"

volumes:
  hearth-db:
  hearth-data:
