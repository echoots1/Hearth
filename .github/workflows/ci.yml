name: CI

# Runs on anything that could change the build or the tests. Docs, the
# compose and deploy files, scripts and the Dependabot config skip it
# (docs/MCP.md is checked by a test, so it stays in). A newer push to the
# same PR or to main cancels a run still going for an older one.
on:
  push:
    branches: [main]
    paths:
      - "**"
      - "!**.md"
      - "docs/MCP.md"
      - "!deploy/**"
      - "!scripts/**"
      - "!docker-compose*.yml"
      - "!.env.example"
      - "!LICENSE"
      - "!.github/dependabot.yml"
      - "!.github/workflows/image.yml"
  pull_request:
    paths:
      - "**"
      - "!**.md"
      - "docs/MCP.md"
      - "!deploy/**"
      - "!scripts/**"
      - "!docker-compose*.yml"
      - "!.env.example"
      - "!LICENSE"
      - "!.github/dependabot.yml"
      - "!.github/workflows/image.yml"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hearth
          POSTGRES_PASSWORD: hearth
          POSTGRES_DB: hearth
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hearth" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://hearth:hearth@localhost:5432/hearth
      APP_SECRET: ci-only-secret-value-that-is-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: hearth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
