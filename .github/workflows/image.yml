name: Image

# Builds the container image for linux/amd64 and linux/arm64 on native runners
# and publishes a multi-arch manifest to GitHub Container Registry.
#
# Three channels:
#   development  ghcr.io/<owner>/hearth:main          a push to main that changes the app
#                ghcr.io/<owner>/hearth:sha-<short>   the same push, pinned
#   qa           ghcr.io/<owner>/hearth:<version>-rc.N a release candidate (below)
#                ghcr.io/<owner>/hearth:qa            moves with each candidate
#   release      ghcr.io/<owner>/hearth:<version>     a release (below)
#                ghcr.io/<owner>/hearth:<major.minor>
#                ghcr.io/<owner>/hearth:latest        moves only with a release
#
# Production installs follow `latest` (the compose files default to it), a QA
# copy follows `qa`, so a merge to main never reaches either until someone
# cuts a candidate or a release.
#
# Cutting a candidate or a release, either way:
#   - Actions → Image → "Run workflow" on main with `release` = X.Y.Z-rc.N (a
#     candidate: `:qa`, GitHub pre-release) or X.Y.Z (a release: `:latest`,
#     GitHub Release). An agent does `gh workflow run image.yml -f release=…`.
#     The run checks that Cargo.toml and web/package.json carry X.Y.Z, creates
#     and pushes the tag itself, builds, and publishes the release entry.
#   - Or push the tag by hand: `scripts/release.sh X.Y.Z[-rc.N]`. The tag push
#     runs the same jobs.
#   Promoting a candidate is dispatching X.Y.Z on the same commit.
# Only what ends up in the image triggers a development build: the Rust and
# web sources, the Cargo manifests, the Dockerfile and this workflow. A newer
# push to main cancels a build still running for an older one; a release run
# has its own group and is never cancelled by a development build.

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "web/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/image.yml"
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "X.Y.Z for a release (:latest) or X.Y.Z-rc.N for a QA candidate (:qa). X.Y.Z must match Cargo.toml and web/package.json. Leave empty for a development build of main."
        required: false
        type: string

concurrency:
  group: image-${{ inputs.release && format('release-{0}', inputs.release) || github.ref }}
  cancel-in-progress: ${{ !inputs.release && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Decide what this run publishes
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the release tag on a dispatched release
    outputs:
      # dev | qa | release
      channel: ${{ steps.decide.outputs.channel }}
      is_release: ${{ steps.decide.outputs.is_release }}
      version: ${{ steps.decide.outputs.version }}
      minor: ${{ steps.decide.outputs.minor }}
      tag: ${{ steps.decide.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide
        id: decide
        env:
          REQUESTED: ${{ inputs.release }}
        run: |
          set -euo pipefail
          cargo_v="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          npm_v="$(python3 -c 'import json; print(json.load(open("web/package.json"))["version"])')"
          # A version is X.Y.Z (release) or X.Y.Z-rc.N (QA candidate); the
          # manifests must carry X.Y.Z either way.
          classify() {
            if [[ "$1" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-rc\.([0-9]+)$ ]]; then
              base="${BASH_REMATCH[1]}"; channel=qa
            elif [[ "$1" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              base="$1"; channel=release
            else
              echo "::error::'$1' is neither X.Y.Z nor X.Y.Z-rc.N"; exit 1
            fi
            [[ "$cargo_v" == "$base" && "$npm_v" == "$base" ]] \
              || { echo "::error::$1 needs Cargo.toml and web/package.json at $base, but they say $cargo_v and $npm_v; merge the bump first"; exit 1; }
          }
          version=""; channel=dev; base=""
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            classify "$version"
          elif [[ -n "$REQUESTED" ]]; then
            [[ "${GITHUB_REF}" == "refs/heads/main" ]] \
              || { echo "::error::candidates and releases are cut from main, not ${GITHUB_REF_NAME}"; exit 1; }
            version="${REQUESTED#v}"
            classify "$version"
            if git ls-remote --exit-code --tags origin "v$version" >/dev/null 2>&1; then
              echo "::error::tag v$version already exists; a version is built once (use the next rc number, or the next version)"; exit 1
            fi
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "v$version" -m "Hearth v$version"
            git push origin "v$version"
            echo "tagged v$version at $(git rev-parse --short HEAD) ($channel)"
          fi
          {
            echo "channel=$channel"
            if [[ -n "$version" ]]; then
              echo "is_release=true"
              echo "version=$version"
              echo "minor=${base%.*}"
              echo "tag=v$version"
            else
              echo "is_release=false"
              echo "version=none"
              echo "minor=none"
              echo "tag="
            fi
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.platform }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Image name (registry paths are lowercase)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/hearth" >> "$GITHUB_OUTPUT"

      - name: Platform slug
        id: platform
        run: echo "slug=$(echo '${{ matrix.platform }}' | tr '/' '-')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.title=Hearth
            org.opencontainers.image.description=Household money, on plan.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.prepare.outputs.is_release == 'true' && needs.prepare.outputs.version || github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          # Keep the manifest list to the two real platforms (no unknown/unknown attestation entries).
          provenance: false
          cache-from: type=gha,scope=${{ steps.platform.outputs.slug }}
          cache-to: type=gha,mode=max,scope=${{ steps.platform.outputs.slug }}

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - uses: actions/upload-artifact@v7
        with:
          name: digests-${{ steps.platform.outputs.slug }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish manifest
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/hearth" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            # development: the branch name (`main`) and the commit
            type=ref,event=branch,enable=${{ needs.prepare.outputs.channel == 'dev' }}
            type=sha,prefix=sha-
            # candidate or release: the exact version (0.2.0-rc.1 / 0.2.0)
            type=raw,value=${{ needs.prepare.outputs.version }},enable=${{ needs.prepare.outputs.is_release == 'true' }}
            # candidate: the moving `qa` tag
            type=raw,value=qa,enable=${{ needs.prepare.outputs.channel == 'qa' }}
            # release: major.minor and the moving `latest` tag
            type=raw,value=${{ needs.prepare.outputs.minor }},enable=${{ needs.prepare.outputs.channel == 'release' }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.channel == 'release' }}

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}

  release:
    name: GitHub release
    if: needs.prepare.outputs.is_release == 'true'
    needs: [prepare, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Create the release entry with generated notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          OWNER: ${{ github.repository_owner }}
        run: |
          image="ghcr.io/$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')/hearth"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          if [[ "$CHANNEL" == "qa" ]]; then
            gh release create "$TAG" --verify-tag --generate-notes --prerelease --title "Hearth $TAG (QA candidate)" \
              --notes "QA candidate. Image: \`$image:${TAG#v}\` (also \`$image:qa\`). A QA copy on the \`qa\` tag picks it up with \`docker compose pull && docker compose up -d\`. When it checks out, run the Image workflow with the plain version to promote it to \`latest\`."
          else
            gh release create "$TAG" --verify-tag --generate-notes --title "Hearth $TAG" \
              --notes "Image: \`$image:${TAG#v}\` (also \`$image:latest\`). Update: \`docker compose pull && docker compose up -d\`, or Edit → Save on TrueNAS. Back up first; migrations are forward-only."
          fi
