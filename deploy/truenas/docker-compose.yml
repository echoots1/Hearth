# Hearth on TrueNAS SCALE (Apps → Discover Apps → ⋮ → Install via YAML).
#
# TrueNAS does not read a .env file, so every setting is written here as a
# literal. Edit the lines marked CHANGE before installing (the URL, the two
# secrets, the database password, the host port); everything else can stay. The same file works with plain `docker compose up -d`.
# CHANGE: the database password, written once here and used by both
# services below. Any characters are fine.
x-postgres-password: &postgres-password "CHANGE-ME-db-password"

services:
  app:
    image: ghcr.io/echoots1/hearth:main
    # Pull the newest `main` every time the app is (re)deployed, so
    # Installed → hearth → Edit → Save is the update button.
    pull_policy: always
    restart: unless-stopped
    environment:
      # CHANGE: the public URL the household reaches Hearth at. https:// makes
      # cookies Secure and is required for the installable app, push and the
      # Claude connector. Plain http://<nas-ip>:3000 is fine for a first look.
      APP_URL: "http://truenas.local:3000"
      # CHANGE: two different random strings, 32+ characters each
      # (`openssl rand -base64 48` in any shell).
      APP_SECRET: "CHANGE-ME-to-a-random-string-of-at-least-32-characters"
      APP_ENCRYPTION_KEY: "CHANGE-ME-to-another-random-string-of-32-characters"
      # The bundled Postgres (the db service below).
      POSTGRES_HOST: "db"
      POSTGRES_USER: "hearth"
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: "hearth"
      # true when a reverse proxy (TrueNAS's own, Nginx Proxy Manager, Caddy,
      # Traefik) sits in front of Hearth.
      TRUST_PROXY: "false"
      # The app always listens on 3000 inside the container; to use a different
      # port on the NAS change only the left side of the ports: line below.
      JOBS_ENABLED: "true"
      LOG_LEVEL: "info,sqlx=warn"
      # Optional integrations: see .env.example in the repo for the full list
      # (Plaid, Privacy.com, ntfy, SMTP). Leave unset to keep them off.
      # NTFY_TOPIC: ""
      # SMTP_HOST: ""
    ports:
      # CHANGE the left side if 3000 is taken on the NAS (for example
      # "3456:3000"). Never the right side.
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "hearth"
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: "hearth"
    volumes:
      # A named volume lives in TrueNAS's apps dataset and is snapshotted with
      # it. To keep the data on a dataset of your own instead, replace the line
      # with a host path such as /mnt/tank/apps/hearth/postgres:/var/lib/postgresql/data
      - hearth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hearth-db:
