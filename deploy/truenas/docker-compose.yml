# Hearth on TrueNAS SCALE (Apps → Discover Apps → ⋮ → Install via YAML).
#
# TrueNAS does not read a .env file, so the few settings that live here are
# literals. Edit the lines marked CHANGE before installing (the database
# password, and the host port if 3000 is taken); everything else is set in
# the app. The same file works with plain `docker compose up -d`.
# CHANGE: the database password, written once here and used by both
# services below. Any characters are fine.
x-postgres-password: &postgres-password "CHANGE-ME-db-password"

services:
  app:
    image: ghcr.io/echoots1/hearth:main
    # Pull the newest `main` every time the app is (re)deployed, so
    # Installed → hearth → Edit → Save is the update button.
    pull_policy: always
    restart: unless-stopped
    # Non-root, read-only root filesystem, no capabilities, no privilege
    # escalation; the app writes only to the hearth-data volume.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      # The bundled Postgres (the db service below).
      POSTGRES_HOST: "db"
      POSTGRES_USER: "hearth"
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: "hearth"
      # Everything else is set inside the app after the first visit:
      #   More → Server          public URL, reverse proxy, MCP hosts, schedules
      #   More → Integrations    Plaid, Privacy.com
      #   More → Notifications   ntfy, email
      # The session and encryption keys are generated on first start and kept
      # in the hearth-data volume. To supply your own instead, uncomment:
      # APP_SECRET: "a-random-string-of-at-least-32-characters"
      # APP_ENCRYPTION_KEY: "another-random-string-of-at-least-32-characters"
      # The app always listens on 3000 inside the container; to use a different
      # port on the NAS change only the left side of the ports: line below.
      JOBS_ENABLED: "true"
      LOG_LEVEL: "info,sqlx=warn"
    ports:
      # CHANGE the left side if 3000 is taken on the NAS (for example
      # "3456:3000"). Never the right side.
      - "3000:3000"
    volumes:
      # Generated keys. Back this up together with the database volume.
      - hearth-data:/app/data
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: "hearth"
      POSTGRES_PASSWORD: *postgres-password
      POSTGRES_DB: "hearth"
    volumes:
      # A named volume lives in TrueNAS's apps dataset and is snapshotted with
      # it. To keep the data on a dataset of your own instead, replace the line
      # with a host path such as /mnt/tank/apps/hearth/postgres:/var/lib/postgresql/data
      - hearth-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hearth -d hearth"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hearth-db:
  hearth-data:
